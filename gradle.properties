# ---- Gradle 运行参数 ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom 尚未兼容 Gradle 配置缓存
org.gradle.configuration-cache=false
# 26.3 的编译目标是 JDK 25：请让 JAVA_HOME 指向 JDK 25（含 javac），
# 或临时用 -Dorg.gradle.java.home=<JDK 25 路径> 覆盖，不在此处写死本机路径。

# ---- Fabric 版本（26.3 线：锁定到用户当前整合包在跑的那一套）----
# 26.2 线原样保留在 git 分支 26.2 上；这里只跟 26.3 对齐。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# ---- 模组信息 ----
# 1.1.5：修掉跨仓库少拿却记成已送达、挥手动画参数、面板非数字数量三处问题。
mod_version=1.1.5
maven_group=com.ds.warehouse
archives_base_name=warehouse-keeper

# ---- 语音取货附加包（可选，独立 jar：warehouse-keeper-voice）----
# 0.1.1：修掉预加载/识别死锁、别名数量恒为 1、跨句错误绑定等复审发现的问题。
voice_version=0.1.1

# ---- 依赖（对齐用户 26.3 实例 mods/ 里的实际版本：fabric-api-0.161.0+26.3.jar）----
fabric_api_version=0.161.0+26.3
