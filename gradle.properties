# ---- Gradle 运行参数 ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom 尚未兼容 Gradle 配置缓存
org.gradle.configuration-cache=false
# 26.3 的编译目标是 JDK 25：请让 JAVA_HOME 指向 JDK 25（含 javac），
# 或临时用 -Dorg.gradle.java.home=<JDK 25 路径> 覆盖，不在此处写死本机路径。

# ---- Fabric 版本（26.3 线：锁定到用户当前整合包在跑的那一套）----
# 26.2 线原样保留在 git 分支 26.2 上；这里只跟 26.3 对齐。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# ---- 模组信息 ----
# 1.2.0：仓库数据改为写进存档目录（<存档>/warehouse-keeper/），同名存档之间不再串数据、
# 数据随存档一起备份与搬迁；同名存档重建时旧数据自动判为孤儿并归档，不继承。
# 面板新增顶级「设置」页（标签栏位置 / 记住上次打开的页面 / 界面密度 / 界面配色 4 套主题）；
# 「物品」子页恢复与其他子页一致的两栏结构；新存档的空仓库引导不再挤在窄列表里。
# 1.1.6：聊天栏 /warehousegui 打开的界面不再被原版聊天界面顶掉；假人死亡或下单超时后副手
# 表演道具不再掉成真物品；配置与索引读不动时先备份再重建、写入改「先临时文件再原子替换」；
# 整理与巡检不再为读箱子强载没加载的区块；索引落盘移到后台线程。
mod_version=1.2.0
maven_group=com.ds.warehouse
archives_base_name=warehouse-keeper

# ---- 语音取货附加包（可选，独立 jar：warehouse-keeper-voice）----
# 0.3.0：**不再内置任何模型**（jar 只有 sherpa 引擎 + win-x64 原生库，约 8 MB），
# 四个模型全部在设置页按需下载；老目录里已解压的 Paraformer 小模型仍算「已装」。
# 另修：失败日志带上真实电平、录音过短不再越界崩客户端、同一段录音只处理一遍、
# 两个阈值拆分、主模型指向未下载模型时说明后果。
# 0.2.0：录音端改为「高通 + 人声段 RMS 归一化 + 信噪比体检」，别名表只记物品名并
# 自动清理旧脏键，匹配放宽拼音阈值，新增语音设置页与模型按需下载（默认 SenseVoice），
# jar 从 374 MB 降到约 83 MB。
voice_version=0.3.0

# ---- 依赖（对齐用户 26.3 实例 mods/ 里的实际版本：fabric-api-0.161.0+26.3.jar）----
fabric_api_version=0.161.0+26.3
