plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom 会自动带上 Minecraft / Fabric 的仓库
	// Modrinth Maven：只用于「开发期把 Iron Chests 拉进测试服务端」。
	// 它不会进入最终发布的 jar，也不会成为对外声明的依赖 ——
	// 用户整合包里那个 IronChests-2.0.8.jar 才是运行时的那一份。
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 仅开发期运行（不会被打包、不会被声明为依赖）：
	// 让 runServer 里也带上 Iron Chests，用来实测
	// 「instanceof Container + getContainerSize()」这条兼容路径
	// 对 126 格 / 12 格宽的大箱子是否成立。
	//
	// 26.3 线先注释掉：Iron Chests 还没有 26.3 版，它声明的 "~26.2" 会让
	// Fabric Loader 直接拒绝启动开发环境（runServer/runClient 起不来）。
	// 等它出 26.3 版，改回版本号并取消注释即可。发布物本来就不含它。
	// runtimeOnly "maven.modrinth:cyberanner-ironchest:2.0.8"

	// Carpet：搬运工假人（/player）靠它。1.3.0 起打进发布 jar（Jar-in-Jar）：
	// 玩家只装主体 mod 就有搬运工，不必自己再装 Carpet。
	// 用户 mods 里另外装了 Carpet 时，Fabric Loader 优先用 mods 目录那份
	// （root 优先、同一 mod id 只选一个），不会 duplicate。
	// Carpet 是 MIT，版权与许可声明见 THIRD-PARTY-NOTICES.md。
	// 仅 include（Loom 的 include 配置自带依赖，不需要 modImplementation）
	include "maven.modrinth:carpet:${project.carpet_version}"

	// 语音附属包：1.3.0 起内置进主体 jar，默认关闭（见 SherpaEngine.enabled）。
	// 语音源码不在本仓库（.gitignore 的 /voice/，由独立仓库同步过来构建），
	// 所以只在存在时打包：干净克隆 / CI 里没有 voice/ 目录，构建出的 jar 不含语音，
	// 其余功能不受影响。
	if (file('voice/build.gradle').exists()) {
		include project(':voice')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
